services:
  postgres:
    image: postgres:16-alpine
    container_name: backend_aws_saa
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    ports:
      # host 5432 is used by another project's postgres (cvreview-db)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dev_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Inside the compose network, postgres resolves to the db service on 5432.
      # On the host (local dev), use postgres://appuser:apppassword@localhost:5433/appdb.
      DATABASE_URL: postgres://appuser:apppassword@postgres:5432/appdb
      PORT: "8080"
      JWT_SECRET: dev-secret-change-me
      JWT_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy
  # ──────────────────────────────────────────────
  # React frontend — served by nginx on :3000
  # Disabled until the frontend app is scaffolded — uncomment then.
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_aws_saa
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  pgdata: